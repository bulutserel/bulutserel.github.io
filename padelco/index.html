<!DOCTYPE html>
<!--
  shell.html - Padel Prototipi / Adim 19.6
  Web export'un ozel HTML kabugu (export_presets.cfg html/custom_html_shell).
  Godot'nun varsayilan kabuguyla ayni baslatma mantigi; uzerine cartoon
  yukleme ekrani: gokyuzu + tepeler + bulutlar, PADELCO logosu, ziplayan top,
  INK konturlu ilerleme cubugu, TR/EN ipuclari. Palet CartoonTheme ile ayni
  (#336699 #339966 #fefff3 #993300 #c6ed2c + INK #132840).
  Not: kabuk Godot'dan once calisir, translations.csv'ye erisemez; ipuclari
  asagidaki kucuk sozlukte durur.
-->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#336699">
		<title>Padelco</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
		<style>
:root {
	--blue: #336699;
	--green: #339966;
	--cream: #fefff3;
	--red: #993300;
	--lime: #c6ed2c;
	--ink: #132840;
	--sky-top: #2a5580;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--cream);
	background-color: var(--blue);
	overflow: hidden;
	touch-action: none;
	font-family: 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
	font-weight: 600;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ---- Yukleme ekrani ---- */
#status {
	position: absolute;
	inset: 0;
	overflow: hidden;
	background: linear-gradient(var(--sky-top), var(--blue) 70%);
	visibility: hidden;
	transition: opacity 0.3s ease-out;
	z-index: 2;
}

#status.fade {
	opacity: 0;
}

.cloud {
	position: absolute;
	left: 0;
	width: clamp(90px, 18vw, 200px);
	animation: drift linear infinite;
}

.cloud.c1 { top: 8%; animation-duration: 38s; animation-delay: -6s; }
.cloud.c2 { top: 22%; width: clamp(70px, 13vw, 150px); animation-duration: 52s; animation-delay: -30s; }
.cloud.c3 { top: 4%; width: clamp(60px, 10vw, 120px); animation-duration: 64s; animation-delay: -48s; }

@keyframes drift {
	from { transform: translateX(-30vw); }
	to { transform: translateX(110vw); }
}

#hills {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	width: 100%;
	height: 34%;
}

#stage {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: clamp(6px, 2.2vh, 22px);
	padding: 16px;
	box-sizing: border-box;
}

#logo {
	margin: 0;
	font-weight: 800;
	font-size: clamp(44px, min(13vw, 17vh), 120px);
	line-height: 1;
	letter-spacing: 0.02em;
	color: var(--lime);
	-webkit-text-stroke: 0.09em var(--ink);
	paint-order: stroke fill;
	text-shadow: 0 0.07em 0 var(--ink);
	animation: wobble 2.4s ease-in-out infinite;
}

@keyframes wobble {
	0%, 100% { transform: rotate(-2deg) scale(1); }
	50% { transform: rotate(2deg) scale(1.03); }
}

#ball-box {
	position: relative;
	width: clamp(60px, 15vh, 110px);
	height: clamp(60px, 15vh, 110px);
}

#ball {
	position: absolute;
	left: 50%;
	bottom: 12%;
	width: 44%;
	aspect-ratio: 1;
	margin-left: -22%;
	transform-origin: 50% 100%;
	animation: bounce 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
}

#ball svg {
	display: block;
	width: 100%;
	height: 100%;
	overflow: visible;
}

#ball-shadow {
	position: absolute;
	left: 50%;
	bottom: 6%;
	width: 40%;
	height: 10%;
	margin-left: -20%;
	border-radius: 50%;
	background: var(--ink);
	opacity: 0.45;
	animation: shadow 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
}

@keyframes bounce {
	0% { transform: translateY(0) scale(1.25, 0.75); }
	12% { transform: translateY(-20%) scale(0.9, 1.15); }
	50% { transform: translateY(-160%) scale(1, 1); }
	88% { transform: translateY(-20%) scale(0.9, 1.15); }
	100% { transform: translateY(0) scale(1.25, 0.75); }
}

@keyframes shadow {
	0%, 100% { transform: scale(1.15); opacity: 0.5; }
	50% { transform: scale(0.55); opacity: 0.2; }
}

#progress-wrap {
	width: min(420px, 70vw);
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 6px;
}

#progress-label {
	font-size: clamp(16px, 4.4vh, 24px);
	color: var(--cream);
	-webkit-text-stroke: 0.22em var(--ink);
	paint-order: stroke fill;
	line-height: 1.1;
}

#bar {
	position: relative;
	width: 100%;
	height: clamp(18px, 5vh, 28px);
	background: var(--cream);
	border: 4px solid var(--ink);
	border-radius: 999px;
	box-shadow: 0 5px 0 var(--ink);
	overflow: hidden;
	box-sizing: border-box;
}

#bar-fill {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0%;
	background: var(--lime);
	border-right: 3px solid var(--ink);
	border-radius: 999px;
	transition: width 0.25s ease-out;
	box-sizing: border-box;
}

#bar.busy #bar-fill {
	width: 100% !important;
	border-right: 0;
	background: repeating-linear-gradient(-45deg, var(--lime) 0 14px, #a9cf1c 14px 28px);
	background-size: 40px 40px;
	animation: stripes 0.6s linear infinite;
}

@keyframes stripes {
	from { background-position: 0 0; }
	to { background-position: 40px 0; }
}

#tip {
	min-height: 2.6em;
	max-width: min(560px, 88vw);
	text-align: center;
	font-size: clamp(14px, 3.6vh, 19px);
	line-height: 1.3;
	color: var(--ink);
	background: var(--cream);
	border: 3px solid var(--ink);
	border-radius: 16px;
	box-shadow: 0 4px 0 var(--ink);
	padding: 6px 14px;
	box-sizing: border-box;
	display: flex;
	align-items: center;
	justify-content: center;
	transition: opacity 0.25s;
}

#tip.hide {
	opacity: 0;
}

#status-notice {
	display: none;
	max-width: min(520px, 88vw);
	background: var(--cream);
	color: var(--ink);
	border: 4px solid var(--red);
	border-radius: 18px;
	box-shadow: 0 5px 0 var(--ink);
	line-height: 1.3;
	padding: 12px 16px;
	text-align: center;
}

#status.notice #progress-wrap,
#status.notice #tip,
#status.notice #ball-box {
	display: none;
}

#status.notice #status-notice {
	display: block;
}

/* Alcak yatay telefon ekraninda ipucunu gizle, digerleri sigsin */
@media (max-height: 340px) {
	#tip { display: none; }
}

@media (prefers-reduced-motion: reduce) {
	.cloud, #logo, #ball, #ball-shadow, #bar.busy #bar-fill { animation: none; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="icon" type="image/png" href="index.icon.png?v=2" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png?v=2" />
<style>html, body, canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }</style>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<svg class="cloud c1" viewBox="0 0 200 90" aria-hidden="true"><path d="M40 78 Q8 78 12 54 Q14 34 40 36 Q46 10 80 14 Q104 -2 130 20 Q160 12 168 40 Q194 44 188 64 Q184 80 160 78 Z" fill="#fefff3" stroke="#132840" stroke-width="6" stroke-linejoin="round"/></svg>
			<svg class="cloud c2" viewBox="0 0 200 90" aria-hidden="true"><path d="M40 78 Q8 78 12 54 Q14 34 40 36 Q46 10 80 14 Q104 -2 130 20 Q160 12 168 40 Q194 44 188 64 Q184 80 160 78 Z" fill="#fefff3" stroke="#132840" stroke-width="6" stroke-linejoin="round"/></svg>
			<svg class="cloud c3" viewBox="0 0 200 90" aria-hidden="true"><path d="M40 78 Q8 78 12 54 Q14 34 40 36 Q46 10 80 14 Q104 -2 130 20 Q160 12 168 40 Q194 44 188 64 Q184 80 160 78 Z" fill="#fefff3" stroke="#132840" stroke-width="6" stroke-linejoin="round"/></svg>
			<svg id="hills" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
				<path d="M-10 140 Q160 40 340 120 T700 100 T1010 90 V310 H-10 Z" fill="#2d8a5c" stroke="#132840" stroke-width="6"/>
				<path d="M-10 210 Q220 120 470 190 T1010 170 V310 H-10 Z" fill="#339966" stroke="#132840" stroke-width="6"/>
			</svg>
			<div id="stage">
				<h1 id="logo">PADELCO</h1>
				<div id="ball-box" aria-hidden="true"><div id="ball-shadow"></div><div id="ball"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#c6ed2c" stroke="#132840" stroke-width="3.5"/><path d="M8 9 Q20 20 8 31 M32 9 Q20 20 32 31" fill="none" stroke="#fefff3" stroke-width="2.6" stroke-linecap="round"/><circle cx="14" cy="13" r="3" fill="#e4ff7a"/></svg></div></div>
				<div id="progress-wrap">
					<div id="progress-label">Loading…</div>
					<div id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="bar-fill"></div></div>
				</div>
				<div id="tip"></div>
				<div id="status-notice"></div>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4547472,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const bar = document.getElementById('bar');
	const barFill = document.getElementById('bar-fill');
	const label = document.getElementById('progress-label');
	const tipBox = document.getElementById('tip');

	// Kabuk metinleri (TR/EN). Oyunun dil secimi (UserSettings) burada henuz yok;
	// tarayici diline bakilir.
	const TEXT = {
		en: {
			loading: 'Loading… %d%',
			preparing: 'Getting ready…',
			error: 'An unknown error occurred.',
			missing: 'Your browser is missing features needed to run the game:\n',
			tips: [
				'Hold the hit button, release for a powerful shot.',
				'A short tap gives a soft, high lob.',
				'Face your own glass and hit: the ball bounces off it!',
				'Hold Shift to run – watch your stamina bar.',
				'The ball\'s shadow shows how high it is.',
				'Hitting the fence before the bounce loses the point.',
			],
		},
		tr: {
			loading: 'Yükleniyor… %%d',
			preparing: 'Hazırlanıyor…',
			error: 'Bilinmeyen bir hata oluştu.',
			missing: 'Tarayıcında oyunun çalışması için gereken özellikler eksik:\n',
			tips: [
				'Vuruş tuşunu basılı tut, bırakınca güçlü vurursun.',
				'Kısa dokunuş yumuşak, yüksek bir lob atar.',
				'Kendi camına dönük vur: top camdan seker!',
				'Shift ile koş – stamina çubuğuna dikkat.',
				'Topun gölgesi ne kadar yüksekte olduğunu gösterir.',
				'Sekmeden önce tele çarpan top sayıyı kaybettirir.',
			],
		},
	};
	const lang = (navigator.language || 'en').toLowerCase().startsWith('tr') ? 'tr' : 'en';
	const T = TEXT[lang];
	// Dokunmatikte kosu yok (Adim 19.2): Shift ipucunu cikar (listede 4. sirada)
	if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
		T.tips.splice(3, 1);
	}
	document.documentElement.lang = lang;

	let initializing = true;
	let statusMode = '';
	let tipIndex = Math.floor(Math.random() * T.tips.length);
	let tipTimer = 0;

	function showTip() {
		tipBox.textContent = T.tips[tipIndex];
	}

	function nextTip() {
		tipBox.classList.add('hide');
		setTimeout(() => {
			tipIndex = (tipIndex + 1) % T.tips.length;
			showTip();
			tipBox.classList.remove('hide');
		}, 250);
	}

	function setPercent(p) {
		const pct = Math.max(0, Math.min(100, Math.round(p)));
		if (pct >= 100) {
			// Indirme bitti; wasm derleme / motor baslatma suresi belirsiz
			bar.classList.add('busy');
			label.textContent = T.preparing;
			bar.removeAttribute('aria-valuenow');
			return;
		}
		bar.classList.remove('busy');
		barFill.style.width = pct + '%';
		label.textContent = T.loading.replace('%d', pct);
		bar.setAttribute('aria-valuenow', pct);
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			initializing = false;
			clearInterval(tipTimer);
			statusOverlay.classList.add('fade');
			setTimeout(() => statusOverlay.remove(), 320);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusOverlay.classList.toggle('notice', mode === 'notice');
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice(T.error);
		}
		setStatusMode('notice');
		initializing = false;
		clearInterval(tipTimer);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice(T.missing + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		showTip();
		tipTimer = setInterval(nextTip, 4000);
		setPercent(0);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					setPercent((current / total) * 100);
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
